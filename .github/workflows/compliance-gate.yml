# ============================================================================
# COMPLIANCE GATE (pending-marker insurance)
# ============================================================================
# Purpose: guarantees the `compliance-check` pending marker (the merge gate's
#          heartbeat) is attempted by a SECOND, independent path on every PR
#          event - the PR Review Trigger stub also posts it. During a GitHub
#          API outage (live-observed 2026-08-17: the statuses POST 503'd
#          while the Actions platform itself kept running) a one-shot post
#          can be swallowed and the PR then LOOKS all-green with no
#          compliance-check context at all. This workflow retries with
#          backoff and, if it still cannot post, FAILS LOUDLY (red gate
#          job) - never silent. The required check itself stays "Expected"
#          (merge blocked) either way; this is redundancy + visibility.
#
# EXECUTES FROM: THE PR's BASE BRANCH (pull_request_target semantics - the
#   workflow FILE always comes from the base branch; a PR cannot redefine
#   this gate). On PRs targeting your integration branch, that branch's copy
#   runs - keep it merge-synced when this file changes
#   (see docs/workflows/overview.md).
#
# WHY pull_request_target AND NOT pull_request: fork PRs place pull_request
#   workflows behind maintainer approval ("action_required") - for as long
#   as the approval sits unanswered, the gate is approval-hostage and the
#   second posting path does not exist exactly where independent
#   verification matters most (untrusted contributors). pull_request_target
#   runs immediately for fork AND same-repo PRs alike. The stub uses the
#   same trigger for the same reason; with the required check configured,
#   an unposted status blocks merge either way, but this workflow's whole
#   job is to make sure the status is POSTED.
#
# SECURITY: ZERO secrets, permissions statuses:write only, NO checkout, no
#   github.event.* content fields in run: (descriptions are fixed strings;
#   the event action is a closed enum; the SHA is hex). The file itself is
#   base-branch-controlled by construction, so a PR cannot weaken this
#   contract. The honest copy's ceiling is posting arbitrary commit
#   statuses with the run's 1h token. Fixtures pin: pull_request_target
#   trigger only, no secrets, no checkout - a pull_request_target workflow
#   must NEVER gain any of those.
# ============================================================================

name: Compliance Gate

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  statuses: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Post pending compliance status
        # Redundant with the PR Review Trigger stub's own (retried) post;
        # two independent trigger paths, one shared contract. The base-repo
        # token posts for fork PRs too (statuses attach to the PR head SHA).
        if: github.event.pull_request.draft == false
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Wording matches the stub exactly: a synchronize push resets
          # prior compliance findings; other events keep "not run yet".
          EVENT_ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_ACTION" = "synchronize" ]; then
            DESC='New commits pushed - compliance reset. Run /mirrobot-check when ready'
          else
            DESC='run /mirrobot-check when ready to merge'
          fi
          for attempt in 1 2 3 4 5 6; do
            if gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f state='pending' \
              -f context='compliance-check' \
              -f description="$DESC"; then
              echo "pending status posted (attempt $attempt)"
              exit 0
            fi
            echo "status post failed (attempt $attempt) - retrying after backoff"
            [ "$attempt" -lt 6 ] && sleep $(( attempt * 10 ))
          done
          echo "::error::Could not post pending compliance status after 6 attempts. The required check stays 'Expected' (merge blocked) - investigate API health."
          exit 1
