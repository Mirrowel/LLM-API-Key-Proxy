name: Scrub Fixture Suite

# Regression suite for the agent-security scrub/roster/permission logic.
# Fires only when the scripts it tests change (or manually), so it adds no
# per-push noise. Zero secrets; read-only checkout of the pushed commit.

on:
  push:
    branches: ['**']
    paths:
      - '.github/scripts/**'
      - '.github/actions/bot-setup/permissions.example.json'
      - '.github/workflows/agent-router.yml'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/actions/bot-setup/permissions.example.json'
      - '.github/workflows/agent-router.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run scrub/roster/permission fixtures
        run: bash .github/scripts/scrub-fixtures.sh
