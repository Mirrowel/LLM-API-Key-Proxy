name: 'Bot Setup'
description: 'Performs all common setup steps for bot workflows, including token generation, git config, dependency installation, and the hardened agent permission profile (written to opencode.json and exported as OPENCODE_PERMISSION).'

inputs:
  bot-app-id:
    description: 'The ID of the GitHub App.'
    required: true
  bot-private-key:
    description: 'The private key of the GitHub App.'
    required: true
  opencode-api-key:
    description: 'Optional API key to apply to the provider inferred from opencode-model.'
    required: false
  opencode-model:
    description: 'The main model to use, in provider/model format (e.g., openai/gpt-4o).'
    required: true
  opencode-fast-model:
    description: 'Optional: The fast model for smaller tasks.'
    required: false
  opencode-config-json:
    description: 'Optional: A complete minified opencode.json used as the base config before model and API key overrides.'
    required: false

outputs:
  token:
    description: "The generated GitHub App token."
    value: ${{ steps.generate_token.outputs.token }}

runs:
  using: "composite"
  steps:
    - name: Generate GitHub App Token
      id: generate_token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.bot-app-id }}
        private-key: ${{ inputs.bot-private-key }}

    - name: Configure Git for Bot
      shell: bash
      env:
        GH_TOKEN: ${{ steps.generate_token.outputs.token }}
      run: |
        git config --global user.name "mirrobot-agent[bot]"
        git config --global user.email "${{ inputs.bot-app-id }}+mirrobot-agent@users.noreply.github.com"
        git config --global url."https://x-access-token:${{ steps.generate_token.outputs.token }}@github.com/".insteadOf "https://github.com/"

    - name: Generate OpenCode Configuration
      shell: bash
      env:
        MAIN_MODEL: ${{ inputs.opencode-model }}
        FAST_MODEL: ${{ inputs.opencode-fast-model }}
        DEFAULT_API_KEY: ${{ inputs.opencode-api-key }}
      run: |
        set -e # Exit immediately if a command fails

        mkdir -p ~/.config/opencode

        # Use the full OpenCode config as the base when supplied. Model inputs below
        # intentionally override it so workflows can select runtime models per job.
        BASE_CONFIG=$(cat <<'EOF'
        ${{ inputs.opencode-config-json }}
        EOF
        )

        if [ -z "$(printf '%s' "$BASE_CONFIG" | tr -d '[:space:]')" ]; then
          CONFIG='{"$schema": "https://opencode.ai/config.json", "username": "mirrobot-agent", "autoupdate": true}'
        else
          if ! CONFIG=$(jq -c . <<< "$BASE_CONFIG"); then
            echo "::error::Configuration error: opencode-config-json must be valid JSON."
            exit 1
          fi

          if ! jq -e 'type == "object"' <<< "$CONFIG" >/dev/null; then
            echo "::error::Configuration error: opencode-config-json must be a JSON object."
            exit 1
          fi
        fi

        # --- MODULAR FUNCTION TO CONFIGURE A MODEL ---
        configure_model() {
          local model_string="$1"
          local config_key="$2"
          local provider="${model_string%%/*}"

          if [[ "$model_string" != */* ]]; then
            echo "::error::Configuration error: ${config_key} must use provider/model format."
            exit 1
          fi

          CONFIG=$(jq --arg key "$config_key" --arg val "$model_string" '.[$key] = $val' <<< "$CONFIG")

          if [[ -n "$DEFAULT_API_KEY" ]]; then
            CONFIG=$(jq \
              --arg provider "$provider" \
              --arg apiKey "$DEFAULT_API_KEY" \
              '.provider[$provider].options.apiKey = $apiKey' <<< "$CONFIG")
          fi
        }

        # --- EXECUTION ---
        configure_model "$MAIN_MODEL" "model"
        if [ -n "$FAST_MODEL" ]; then
          configure_model "$FAST_MODEL" "small_model"
        fi

        # --- HARDENED AGENT PERMISSION PROFILE (security) ---
        # Single source of truth for the agent permission profile, applied to the
        # generated opencode.json AND exported as OPENCODE_PERMISSION for the job
        # (replaces the per-workflow OPENCODE_PERMISSION env blocks).
        # This intentionally OVERRIDES any permission block supplied via
        # opencode-config-json: the permission profile is a security invariant.
        #
        # opencode permission rules are last-match-wins with simple wildcards
        # (* = any chars). Ordering below is load-bearing:
        #   1. bash catch-all deny (makes the allowlist real — unmatched commands
        #      would otherwise default to allow)
        #   2. allows for the commands the agent workflows rely on
        #   3. targeted denies LAST (secrets disclosure, egress, privilege pivots)
        #
        # FUTURE OPTION (deliberately NOT enabled): route unverified requesters to
        # the fast model using the trust classification from
        # .github/actions/requester-context.
        cat > /tmp/hardened_permissions.json <<'PERMS_EOF'
        {
          "bash": {
            "*": "deny",
            "gh*": "allow",
            "git*": "allow",
            "jq*": "allow",
            "cat*": "allow",
            "ls*": "allow",
            "head*": "allow",
            "tail*": "allow",
            "wc*": "allow",
            "grep*": "allow",
            "rg*": "allow",
            "find*": "allow",
            "sort*": "allow",
            "uniq*": "allow",
            "mkdir*": "allow",
            "touch*": "allow",
            "sed*": "allow",
            "awk*": "allow",
            "diff*": "allow",
            "echo*": "deny",
            "printf*": "deny",
            "curl*": "deny",
            "wget*": "deny",
            "env": "deny",
            "env *": "deny",
            "printenv*": "deny",
            "gh gist*": "deny",
            "gh api *gist*": "deny",
            "gh secret*": "deny",
            "gh api *secret*": "deny",
            "gh workflow*": "deny",
            "gh api *dispatch*": "deny",
            "gh run rerun*": "deny",
            "gh repo delete*": "deny",
            "gh repo edit*": "deny",
            "git push --force*": "deny",
            "git push -f*": "deny",
            "git config --global*": "deny",
            "git config -l*": "deny",
            "git config --list*": "deny",
            "git config --get*": "deny",
            "cat ~/.config*": "deny",
            "cat $HOME*": "deny",
            "cat /home/runner/.config*": "deny",
            "head ~/.config*": "deny",
            "head $HOME*": "deny",
            "tail ~/.config*": "deny",
            "tail $HOME*": "deny",
            "grep*~/.config*": "deny",
            "grep*$HOME*": "deny",
            "rg*~/.config*": "deny",
            "rg*$HOME*": "deny",
            "sed*~/.config*": "deny",
            "sed*$HOME*": "deny",
            "awk*~/.config*": "deny",
            "awk*$HOME*": "deny",
            "jq*~/.config*": "deny",
            "jq*$HOME*": "deny",
            "jq -n *env*": "deny",
            "jq -n *$ENV*": "deny",
            "*$GITHUB_TOKEN*": "deny",
            "*$GH_TOKEN*": "deny"
          },
          "read": {
            "*": "allow",
            "~/.config/opencode/*": "deny"
          },
          "edit": {
            ".github/workflows/*": "deny",
            ".github/actions/*": "deny",
            ".github/prompts/*": "deny"
          },
          "external_directory": "allow",
          "webfetch": "deny",
          "websearch": "allow"
        }
        PERMS_EOF

        if ! jq -e . /tmp/hardened_permissions.json >/dev/null 2>&1; then
          echo "::error::Internal error: hardened permission profile is not valid JSON."
          exit 1
        fi

        CONFIG=$(jq --slurpfile perms /tmp/hardened_permissions.json '.permission = $perms[0]' <<< "$CONFIG")

        # Export the same profile as OPENCODE_PERMISSION for the job so the env
        # contract used by opencode run stays satisfied from one canonical source.
        {
          echo "OPENCODE_PERMISSION<<OPENCODE_PERMS_EOF"
          cat /tmp/hardened_permissions.json
          echo "OPENCODE_PERMS_EOF"
        } >> "$GITHUB_ENV"

        # --- FINALIZATION ---
        jq -e . <<< "$CONFIG" > ~/.config/opencode/opencode.json
        chmod 600 ~/.config/opencode/opencode.json
        # echo "--- Generated OpenCode Configuration ---"
        # jq . ~/.config/opencode/opencode.json
        # echo "----------------------------------------"
        echo "Successfully generated OpenCode configuration."

    - name: Check for Python requirements file
      id: check_requirements_file
      shell: bash
      run: |
        if [ -f requirements.txt ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up uv
      if: steps.check_requirements_file.outputs.exists == 'true'
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: "requirements.txt"

    - name: Set up Python with uv
      if: steps.check_requirements_file.outputs.exists == 'true'
      shell: bash
      run: |
        uv python install 3.12
        uv venv --python 3.12

    - name: Install dependencies
      if: steps.check_requirements_file.outputs.exists == 'true'
      shell: bash
      run: |
        source .venv/bin/activate
        uv pip install -r requirements.txt

    - name: Install opencode
      shell: bash
      run: curl -fsSL https://opencode.ai/install | bash

    - name: Ensure opencode directory exists
      shell: bash
      run: mkdir -p /home/runner/.local/share/opencode/project
