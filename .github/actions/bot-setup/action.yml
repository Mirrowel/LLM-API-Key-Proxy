name: 'Bot Setup'
description: 'Performs all common setup steps for bot workflows, including token selection, git config, and dependency installation. Dual identity mode: uses the bot ACCOUNT token when provided (account mode), falling back to the GitHub App installation token (app mode). Agent permissions are owned by the OPENCODE_CONFIG_JSON secret (see permissions.example.json); this action does not inject or export any permission configuration, and content packs cannot change it either.'

inputs:
  account-token:
    description: 'Optional bot-account PAT. When non-empty, runs in account mode (this token is used directly, validated against /user) and the App credentials below are ignored.'
    required: false
    default: ''
  bot-app-id:
    description: 'The ID of the GitHub App (app mode only, required when no account token is provided).'
    required: false
    default: ''
  bot-private-key:
    description: 'The private key of the GitHub App (app mode only, required when no account token is provided).'
    required: false
    default: ''
  opencode-api-key:
    description: 'Optional API key to apply to the provider inferred from opencode-model.'
    required: false
  opencode-model:
    description: 'The main model to use, in provider/model format (e.g., openai/gpt-4o). Optional when OPENCODE_CONFIG_JSON carries its own "model" field; one of the two is required.'
    required: false
  opencode-config-json:
    description: 'Optional: A complete minified opencode.json used as the base config before model and API key overrides.'
    required: false
  content-packs:
    description: 'Optional: contents of the CONTENT_PACKS repo variable. Flat comma list of content pack sources: owner/repo[@ref] (GitHub repository, shallow-fetched) or https://... (zip or tar.gz). Later entries win. A pack may hold .agents/skills/, plugins/, agents/, commands/, extensions/<name>/install.sh and an opencode.json fragment; everything else is ignored. Unset = no packs.'
    required: false
    default: ''
  content-pack-token:
    description: 'Optional: token for private pack sources (repository or link). Used as a git credential or Bearer header; never placed in a URL or printed.'
    required: false
    default: ''
  private-content-packs:
    description: 'Optional: value of the CONTENT_PACKS_PRIVATE secret. Private archive links in the same format as content-packs, appended after its entries. Private links must travel through this secret and never through a repository variable: the runner echoes variables into the log in clear.'
    required: false
    default: ''
  agent-key:
    description: 'Optional: per-agent key (e.g. pr-review, bot-reply) resolved against the AGENT_MODELS_JSON variable to override the global model for this agent. Missing key or empty model string falls back to the global inputs.'
    required: false
    default: ''
  agent-models-json:
    description: 'Optional: contents of the AGENT_MODELS_JSON repo variable: {"<agent-key>": {"model": "provider/model", "fast": "provider/model"}}. Malformed JSON fails loudly; empty/missing keys fall back silently.'
    required: false
    default: ''
  openshare-config-json:
    description: 'Optional: contents of the OPENSHARE_CONFIG_JSON secret. When set: the released OpenShare single-file plugin is fetched from the OpenShare repo (sha256 logged), staged under ~/.mirrobot-plugins/ with this config adjacent, and registered in the opencode plugin array. Live session sharing; absent = plugin dormant (passive artifacts still produced). The whole dir is deleted after boot like the opencode config.'
    required: false
    default: ''
  openshare-bundle-url:
    description: 'Optional: override the URL the OpenShare bundle is fetched from (repo variable OPENSHARE_BUNDLE_URL, e.g. raw .../OpenShare/dev/share-plugin/ci/openshare.js while dev is ahead of master). Empty = released master line.'
    required: false
    default: ''

outputs:
  token:
    description: "The bot token (account PAT in account mode, App installation token in app mode)."
    value: ${{ steps.account_token.outputs.token || steps.generate_token.outputs.token }}
  mode:
    description: "Which identity mode was activated: 'account' or 'app'."
    value: ${{ steps.resolve_mode.outputs.mode }}
  identity:
    description: "Human-readable bot identity used this run (account login in account mode, the app bot name in app mode), for logging."
    value: ${{ steps.account_token.outputs.login || 'mirrobot-agent[bot]' }}

runs:
  using: "composite"
  steps:
    - name: Resolve token mode
      id: resolve_mode
      shell: bash
      env:
        ACCOUNT_TOKEN: ${{ inputs.account-token }}
        APP_ID: ${{ inputs.bot-app-id }}
        APP_KEY: ${{ inputs.bot-private-key }}
      run: |
        if [ -n "$ACCOUNT_TOKEN" ]; then
          echo "mode=account" >> "$GITHUB_OUTPUT"
        elif [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
          echo "mode=app" >> "$GITHUB_OUTPUT"
        else
          echo "::error::No bot credentials available. Provide ACCOUNT_GH_TOKEN (account mode) or BOT_APP_ID + BOT_PRIVATE_KEY (app mode)."
          exit 1
        fi

    - name: Validate account token (account mode)
      id: account_token
      if: steps.resolve_mode.outputs.mode == 'account'
      shell: bash
      env:
        ACCOUNT_TOKEN: ${{ inputs.account-token }}
      run: |
        set -e
        # Fail-fast validation: a present-but-broken secret must NOT silently
        # fall back to app mode - it needs human attention (rotation).
        # ONE round-trip (--include) yields body (login, id) AND the
        # X-OAuth-Scopes header, so scope sufficiency is checked here too.
        resp=$(GH_TOKEN="$ACCOUNT_TOKEN" gh api --include /user) || {
          echo "::error::ACCOUNT_GH_TOKEN is set but invalid (gh api /user failed). Rotate the secret or remove it to fall back to app mode."
          exit 1
        }
        body=$(printf '%s\n' "$resp" | awk 'body {print} /^\r?$/{body=1}')
        login=$(printf '%s' "$body" | jq -r .login)
        account_id=$(printf '%s' "$body" | jq -r .id)
        # __ABSENT__ sentinel distinguishes "header not in response" (non-classic
        # token) from "header present but empty" (classic token with NO scopes).
        scopes=$(printf '%s\n' "$resp" | awk '
          tolower($0) ~ /^x-oauth-scopes:/ {
            sub(/^[^:]*:[ ]*/, ""); gsub(/\r/, ""); print; found = 1; exit
          }
          END { if (!found) print "__ABSENT__" }')

        echo "token=$ACCOUNT_TOKEN" >> "$GITHUB_OUTPUT"
        echo "login=$login" >> "$GITHUB_OUTPUT"
        echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
        # Identity auto-detection for bot-config.sh: the account login joins
        # the resolved identity set (and derives trigger stems when no
        # BOT_TRIGGERS variable is set). App mode cannot self-detect
        # (installation tokens 403 on /user) - it relies on the variable
        # or the stock fallback.
        echo "BOT_DETECTED_LOGIN=$login" >> "$GITHUB_ENV"

        # Scope contract (classic PAT): public_repo (or repo) required for the
        # bot's work; `workflow` FORBIDDEN - without that scope GitHub
        # mechanically rejects .github/workflows pushes, which is the platform
        # backstop the agent's whole workflow-deny posture relies on.
        if [ "$scopes" = "__ABSENT__" ]; then
          echo "::warning::Could not read X-OAuth-Scopes (non-classic token?). Proceeding without scope verification - expected: classic PAT, public_repo only, WITHOUT workflow scope."
        elif [ -z "$scopes" ]; then
          echo "::error::ACCOUNT_GH_TOKEN carries NO scopes (X-OAuth-Scopes header is empty) - it cannot operate on the repository. Regenerate with public_repo."
          exit 1
        else
          echo "Token scopes: $scopes"
          # CRs stripped at extraction; commas normalized to spaces so word
          # matching is position-independent ("workflow, public_repo" and
          # "public_repo, workflow" both match; last-position too).
          scopes_norm=" ${scopes//,/ } "
          case "$scopes_norm" in
            *" workflow "*)
              echo "::error::ACCOUNT_GH_TOKEN has the 'workflow' scope - this removes the platform's workflow-push hard-deny. Regenerate the PAT with public_repo ONLY."
              exit 1
              ;;
          esac
          case "$scopes_norm" in
            *" public_repo "*|*" repo "*) : ;;
            *)
              echo "::error::ACCOUNT_GH_TOKEN lacks public_repo/repo scope - the token cannot operate on the repository. Regenerate with public_repo."
              exit 1
              ;;
          esac
        fi
        echo "::notice::Bot identity: account @$login (account-token mode)"

    - name: Generate GitHub App Token (app mode)
      id: generate_token
      if: steps.resolve_mode.outputs.mode == 'app'
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.bot-app-id }}
        private-key: ${{ inputs.bot-private-key }}

    - name: Configure Git for Bot
      shell: bash
      env:
        MODE: ${{ steps.resolve_mode.outputs.mode }}
        ACCOUNT_TOKEN: ${{ inputs.account-token }}
        APP_TOKEN: ${{ steps.generate_token.outputs.token }}
        ACCOUNT_LOGIN: ${{ steps.account_token.outputs.login }}
        ACCOUNT_ID: ${{ steps.account_token.outputs.account_id }}
        APP_ID: ${{ inputs.bot-app-id }}
      run: |
        set -e
        if [ "$MODE" = "account" ]; then
          # Account mode: commits attribute to the bot account profile via the
          # ID-prefixed noreply email; display name keeps the [bot] look.
          NAME="${ACCOUNT_LOGIN}[bot]"
          EMAIL="${ACCOUNT_ID}+${ACCOUNT_LOGIN}@users.noreply.github.com"
          TOKEN="$ACCOUNT_TOKEN"
        else
          # App mode. Display name carries the capitalized branding; commit
          # attribution rides the numeric ID in the noreply email, so email
          # casing is cosmetic too. (If the GitHub App is renamed, the API
          # bot login follows the new casing; repo-side identity matching is
          # case-insensitive everywhere.)
          NAME="Mirrobot-Agent[bot]"
          EMAIL="${APP_ID}+Mirrobot-Agent@users.noreply.github.com"
          TOKEN="$APP_TOKEN"
        fi
        git config --global user.name "$NAME"
        git config --global user.email "$EMAIL"
        # Git authentication WITHOUT credential materialization: gh's
        # credential helper reads GH_TOKEN from the session environment on
        # demand. The previous approach (a global url.<token>.insteadOf
        # rewrite) embedded the token into every github.com URL git
        # resolves or PRINTS - `git remote -v` in any session surfaced the
        # raw PAT (live incident 2026-09-15: it rode a public share
        # session). The helper keeps auth functional with nothing
        # credential-shaped in any URL, config value, or printed output.
        git config --global credential.https://github.com.helper '!gh auth git-credential'

    # Private archive links arrive through a SECRET input on purpose: the
    # runner echoes every step env block and action input into the log, and
    # GitHub masks secrets there but prints repository variables in clear.
    - name: Fetch content packs
      shell: bash
      env:
        CONTENT_PACKS: ${{ inputs.content-packs }}
        PRIVATE_CONTENT_PACKS: ${{ inputs.private-content-packs }}
        PACK_TOKEN: ${{ inputs.content-pack-token }}
      run: python3 "${GITHUB_ACTION_PATH}/install-packs.py" fetch

    # The installer runs in the background from here and is waited for below,
    # so its download overlaps the config and content steps. It needs no
    # credentials: the installer is a public script. Its GITHUB_PATH file is
    # pointed at /dev/null on purpose: the runner reads that file when the
    # launching step ends, so a write from the background is lost, and the
    # wait step below exports the install directory itself.
    - name: Start the opencode install in the background
      shell: bash
      run: |
        rm -f "$RUNNER_TEMP/opencode-install.done"
        GITHUB_PATH=/dev/null nohup setsid bash -c 'set -o pipefail; curl -fsSL https://opencode.ai/install | bash; echo "$?" > "$0"' "$RUNNER_TEMP/opencode-install.done" > "$RUNNER_TEMP/opencode-install.log" 2>&1 < /dev/null &
        echo "opencode installer started in the background."

    # The upstream skill fetch is plain git and file copying, about 4 seconds
    # alone. It starts here, beside the installer, and is normally done by
    # the time the extensions start; see the step that starts them.
    - name: Start the upstream skill fetch in the background
      shell: bash
      run: python3 "${GITHUB_ACTION_PATH}/install-packs.py" start-skills

    - name: Generate OpenCode Configuration
      shell: bash
      env:
        MAIN_MODEL: ${{ inputs.opencode-model }}
        DEFAULT_API_KEY: ${{ inputs.opencode-api-key }}
        AGENT_KEY: ${{ inputs.agent-key }}
        AGENT_MODELS_JSON: ${{ inputs.agent-models-json }}
      run: |
        set -e # Exit immediately if a command fails

        mkdir -p ~/.config/opencode

        # --- PER-AGENT MODEL RESOLUTION (AGENT_MODELS_JSON variable) ---
        # Precedence: agent-specific entry > global inputs. Empty string
        # values count as absent (the seeded template ships empty strings).
        # Malformed JSON is a hard error: a typo must never silently
        # degrade every agent to the global model. Model values are never
        # echoed here.
        if [ -n "$AGENT_MODELS_JSON" ] && [ -n "$AGENT_KEY" ]; then
          if ! jq -e type >/dev/null 2>&1 <<< "$AGENT_MODELS_JSON"; then
            echo "::error::AGENT_MODELS_JSON variable is not valid JSON. Fix it in repo settings (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 1
          fi
          resolved_model=$(jq -r --arg k "$AGENT_KEY" '.[$k].model // "" | select(. != "")' <<< "$AGENT_MODELS_JSON" 2>/dev/null || true)
          if [ -n "$resolved_model" ]; then
            MAIN_MODEL="$resolved_model"
            echo "Model: per-agent override for '$AGENT_KEY' active."
          fi
          resolved_fast=$(jq -r --arg k "$AGENT_KEY" '.[$k].fast // "" | select(. != "")' <<< "$AGENT_MODELS_JSON" 2>/dev/null || true)
          if [ -n "$resolved_fast" ]; then
            FAST_MODEL="$resolved_fast"
          fi
        fi

        # Use the full OpenCode config as the base when supplied. Model inputs below
        # intentionally override it so workflows can select runtime models per job.
        BASE_CONFIG=$(cat <<'EOF'
        ${{ inputs.opencode-config-json }}
        EOF
        )

        if [ -z "$(printf '%s' "$BASE_CONFIG" | tr -d '[:space:]')" ]; then
          CONFIG='{"$schema": "https://opencode.ai/config.json", "username": "mirrobot-agent", "autoupdate": true}'
        else
          if ! CONFIG=$(jq -c . <<< "$BASE_CONFIG"); then
            echo "::error::Configuration error: opencode-config-json must be valid JSON."
            exit 1
          fi

          if ! jq -e 'type == "object"' <<< "$CONFIG" >/dev/null; then
            echo "::error::Configuration error: opencode-config-json must be a JSON object."
            exit 1
          fi
        fi

        # --- MODULAR FUNCTION TO CONFIGURE A MODEL ---
        configure_model() {
          local model_string="$1"
          local config_key="$2"
          local provider="${model_string%%/*}"

          if [[ "$model_string" != */* ]]; then
            echo "::error::Configuration error: ${config_key} must use provider/model format."
            exit 1
          fi

          CONFIG=$(jq --arg key "$config_key" --arg val "$model_string" '.[$key] = $val' <<< "$CONFIG")

          if [[ -n "$DEFAULT_API_KEY" ]]; then
            CONFIG=$(jq \
              --arg provider "$provider" \
              --arg apiKey "$DEFAULT_API_KEY" \
              '.provider[$provider].options.apiKey = $apiKey' <<< "$CONFIG")
          fi
        }

        # --- EXECUTION ---
        # Model resolution: OPENCODE_MODEL (or the per-agent override) sets
        # the config's model key when provided; otherwise the config secret's
        # own "model" field satisfies the requirement (one of the two must
        # exist). The API key is applied to the active model's provider only
        # when the OPENCODE_API_KEY secret is provided - it is never required,
        # the key can live inside the config itself.
        if [ -n "$MAIN_MODEL" ]; then
          configure_model "$MAIN_MODEL" "model"
        else
          config_model=$(jq -r '.model // "" | select(. != "")' <<< "$CONFIG" 2>/dev/null || true)
          if [ -n "$config_model" ] && [[ "$config_model" == */* ]]; then
            if [ -n "$DEFAULT_API_KEY" ]; then
              CONFIG=$(jq \
                --arg provider "${config_model%%/*}" \
                --arg apiKey "$DEFAULT_API_KEY" \
                '.provider[$provider].options.apiKey = $apiKey' <<< "$CONFIG")
            fi
          else
            echo "::error::No model configured: set the OPENCODE_MODEL secret (provider/model) or put a \"model\" field (provider/model format) inside OPENCODE_CONFIG_JSON. One of the two is required."
            exit 1
          fi
        fi
        if [ -n "$FAST_MODEL" ]; then
          configure_model "$FAST_MODEL" "small_model"
        fi

        # NOTE ON PERMISSIONS: the agent permission profile is owned by the
        # OPENCODE_CONFIG_JSON secret (repository settings), NOT by this action.
        # Whatever `permission` block the secret supplies lands in
        # ~/.config/opencode/opencode.json verbatim; no permission injection or
        # OPENCODE_PERMISSION export happens here. The env var variant would
        # deep-merge over the config (upstream issue #22292) and override it.
        # See .github/actions/bot-setup/permissions.example.json for the
        # recommended profile to paste into the secret.
        if ! jq -e 'has("permission")' <<< "$CONFIG" >/dev/null 2>&1; then
          echo "::warning::OPENCODE_CONFIG_JSON has no permission block; the agent will run on opencode's permissive defaults. Paste the permission block from .github/actions/bot-setup/permissions.example.json into the secret."
        else
          # Drift check (effective-verdict semantics): the live permission
          # block must effectively DENY everything the recommended example
          # denies. opencode evaluates ordered rules last-match-wins, so a
          # deny key shadowed by a later allow is no deny at all - the
          # checker compares EFFECTIVE verdicts over a probe corpus built
          # from both profiles' patterns (see permission-drift.py).
          # Operator additions and stricter flips are fine and silent; a
          # missing, shadowed, or loosened example deny erodes the security
          # core and gets a warning. The warning deliberately names NOTHING
          # (run logs are public): no rules, no sections, no specifics - just
          # the count. Compare against the example locally to see what.
          mismatch=$(printf '%s' "$CONFIG" | python3 "${GITHUB_ACTION_PATH}/permission-drift.py" \
            "${GITHUB_ACTION_PATH}/permissions.example.json" - 2>/dev/null || echo 0)
          if [ "${mismatch:-0}" -gt 0 ]; then
            echo "::warning::OPENCODE_CONFIG_JSON permission block is missing or has loosened ${mismatch} security rule(s) from the recommended profile. Details are deliberately not logged (public run logs) - compare the secret against .github/actions/bot-setup/permissions.example.json and refresh it."
          fi
        fi

        # --- FINALIZATION ---
        jq -e . <<< "$CONFIG" > ~/.config/opencode/opencode.json
        chmod 600 ~/.config/opencode/opencode.json
        # A content pack may carry an opencode.json fragment; it merges under
        # the config just written (arrays union, base wins, permission never).
        python3 "${GITHUB_ACTION_PATH}/install-packs.py" merge-config "$HOME/.config/opencode/opencode.json"
        # echo "--- Generated OpenCode Configuration ---"
        # jq . ~/.config/opencode/opencode.json
        # echo "----------------------------------------"
        echo "Successfully generated OpenCode configuration."

    - name: Install content packs and mask credential leaves
      shell: bash
      run: |
        set -e
        # Allowlisted pack content lands where opencode discovers it: skills
        # under ~/.agents/skills, plugins, agents and commands under
        # ~/.config/opencode. Reading those homes is permission-denied except
        # for skills, and nothing there holds a credential.
        python3 "${GITHUB_ACTION_PATH}/install-packs.py" install

        # --- MASK CREDENTIAL LEAVES (config- and auth-derived secrets) ---
        # GitHub masks whole SECRET values automatically, but
        # OPENCODE_CONFIG_JSON is one blob: its inner leaves (provider
        # apiKeys, mcp header values, credential-bearing URLs) would echo
        # UNMASKED if any step ever printed them. Register each leaf
        # explicitly so every later step's output is scrubbed. The URL rule
        # catches credential QUERY PARAMS with any prefix (e.g.
        # ?tavilyApiKey=...). GitHub ignores masks shorter than 8
        # characters, so short values cannot be registered and are skipped.
        # auth.json (opencode's own credential store - oauth refresh/access
        # tokens, provider "key" entries like cr_...) is swept with the same
        # walker whenever it exists (live incident 2026-09-15: a token rode
        # a public share because no mask covered its shape).
        CRED_LEAF_WALK='
          [ (.. | objects | to_entries[]
              | select(.key | test("(api[_-]?key|key|token|secret|password|authorization|cookie|refresh|access|credential)"; "i"))
              | .value | strings | select(length >= 8))
            , (.. | strings
              | select(length >= 8)
              | select(test("https?://.+[?&].*(api[_-]?key|token|secret|password)=" ; "i")))
          ] | unique | .[]
        '
        for cred_source in "$HOME/.config/opencode/opencode.json" \
                           "$HOME/.local/share/opencode/auth.json" \
                           "$HOME/.config/opencode/auth.json"; do
          [ -f "$cred_source" ] || continue
          while IFS= read -r v; do
            [ -z "$v" ] && continue
            if [ "${#v}" -ge 8 ]; then
              printf '::add-mask::%s\n' "$v"
            fi
          done < <(jq -r "$CRED_LEAF_WALK" "$cred_source" 2>/dev/null || true)
        done
        echo "Credential leaf masking applied."

    - name: Prepare OpenShare plugin (masks + background download)
      shell: bash
      env:
        OPENSHARE_CONFIG: ${{ inputs.openshare-config-json }}
        OPENSHARE_BUNDLE_URL: ${{ inputs.openshare-bundle-url }}
      run: |
        set -e
        if [ -z "$(printf '%s' "$OPENSHARE_CONFIG" | tr -d '[:space:]')" ]; then
          echo "OpenShare config secret absent - live sharing disabled (passive artifacts still produced)."
          exit 0
        fi
        # Shape check + credential-leaf masking. GitHub masks the whole
        # secret blob, but inner values (servers[].token, authPassword)
        # echoed on their own would print unmasked - same reasoning as the
        # config walker above.
        jq -e 'type == "object"' <<< "$OPENSHARE_CONFIG" >/dev/null || {
          echo "::error::OPENSHARE_CONFIG_JSON is not a JSON object."; exit 1; }
        while IFS= read -r leaf; do
          [ -z "$leaf" ] && continue
          [ "${#leaf}" -ge 8 ] && printf '::add-mask::%s\n' "$leaf"
        done < <(jq -r '[.. | objects | to_entries[]
            | select(.key | test("(token|password|secret|key)"; "i"))
            | .value | strings | select(length >= 8)] | .[]' <<< "$OPENSHARE_CONFIG")

        # Released single-file bundle from the OpenShare repo (master is
        # the released line; auto-updates on every OpenShare release). The
        # repo variable can point the fetch at another branch while it is
        # ahead (OPENSHARE_BUNDLE_URL); delete the variable to return to
        # the released master line. Fetch failure degrades to no live
        # sharing - never fails the run.
        PLUGINS_DIR="$HOME/.mirrobot-plugins"
        mkdir -p "$PLUGINS_DIR"; chmod 700 "$PLUGINS_DIR"
        BUNDLE="$PLUGINS_DIR/openshare.js"

        # Released single-file bundle from the OpenShare repo (master is
        # the released line; auto-updates on every OpenShare release). The
        # repo variable can point the fetch at another branch while it is
        # ahead (OPENSHARE_BUNDLE_URL); delete the variable to return to
        # the released master line.
        #
        # raw.githubusercontent.com answers 429 to the shared addresses of
        # hosted runners, and that window outlasts a quick retry loop: four
        # attempts inside seven seconds all failed in one run, which cost
        # that run its live share. The download runs in the background with
        # retries spread over a minute and the staging step below collects
        # it, so a healthy download costs setup nothing.
        BUNDLE_URL="${OPENSHARE_BUNDLE_URL:-https://raw.githubusercontent.com/Mirrowel/OpenShare/master/share-plugin/ci/openshare.js}"
        rm -f "$RUNNER_TEMP/openshare-bundle.done"
        nohup setsid bash -c 'for i in 1 2 3 4 5 6 7; do
            if curl -fsSL --max-time 20 "$1" -o "$2.part"; then mv "$2.part" "$2"; echo 0 > "$3"; exit 0; fi
            rm -f "$2.part"; [ "$i" -lt 7 ] && sleep $(( i * 4 ))
          done; echo 1 > "$3"' _ "$BUNDLE_URL" "$BUNDLE" "$RUNNER_TEMP/openshare-bundle.done" > "$RUNNER_TEMP/openshare-bundle.log" 2>&1 < /dev/null &
        echo "OpenShare bundle download started in the background."

    - name: Check for Python requirements file
      id: check_requirements_file
      shell: bash
      run: |
        if [ -f requirements.txt ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up uv
      if: steps.check_requirements_file.outputs.exists == 'true'
      # Pinned to the exact release: setup-uv stopped maintaining moving
      # major tags at v8 (there is no v10 tag, only v10.x.y).
      uses: astral-sh/setup-uv@v10.4.0
      with:
        enable-cache: true
        cache-dependency-glob: "requirements.txt"

    - name: Set up Python with uv
      if: steps.check_requirements_file.outputs.exists == 'true'
      shell: bash
      run: |
        uv python install 3.12
        uv venv --python 3.12

    - name: Install dependencies
      if: steps.check_requirements_file.outputs.exists == 'true'
      shell: bash
      run: |
        source .venv/bin/activate
        uv pip install -r requirements.txt

    - name: Wait for the opencode install
      shell: bash
      run: |
        done_file="$RUNNER_TEMP/opencode-install.done"
        for _ in $(seq 1 1500); do [ -f "$done_file" ] && break; sleep 0.2; done
        if [ ! -f "$done_file" ] || [ "$(cat "$done_file")" != "0" ]; then
          if [ -x "$HOME/.opencode/bin/opencode" ]; then
            echo "The opencode installer reported a failure, but the binary is present; continuing."
          else
            echo "::error::The opencode installer did not finish. Last lines of its log:"
            tail -n 30 "$RUNNER_TEMP/opencode-install.log"
            exit 1
          fi
        fi
        # The installer's own PATH export is lost when it runs in the background.
        echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

    - name: Read the opencode version
      id: opencode_version
      shell: bash
      run: |
        bin="$(command -v opencode || true)"
        [ -n "$bin" ] || bin="$HOME/.opencode/bin/opencode"
        echo "version=$("$bin" --version 2>/dev/null | head -n 1 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

    # opencode installs its plugin SDK (@opencode-ai/plugin and about 28
    # dependencies) into every config directory before it loads the first
    # plugin. On a GitHub runner that is two directories: the global config
    # directory, and the install directory (~/.opencode), which opencode also
    # counts as a project config directory because the workspace lies under
    # the home directory. Each install takes about 5 seconds on a fresh
    # runner (20 to 70 when the package registry is slow), and the agent's
    # plugins import none of it. A copy from the previous run makes opencode
    # skip both. The same entry keeps opencode's model catalog (models.json,
    # public data), which spares a small download. Cached: only the SDK's own
    # three paths in each directory and that file, never a config file or a
    # plugin. The key carries the opencode version, so each new release pays
    # the install once. The cache is an optimization: when it fails, the run
    # is exactly what it was before.
    - name: Restore the plugin SDK from the previous run
      id: plugin_sdk
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.config/opencode/node_modules
          ~/.config/opencode/package.json
          ~/.config/opencode/package-lock.json
          ~/.opencode/node_modules
          ~/.opencode/package.json
          ~/.opencode/package-lock.json
          ~/.cache/opencode/models.json
        key: opencode-plugin-sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.opencode_version.outputs.version }}-v2

    # Deliberately after the opencode install and the SDK restore. The runner
    # has two cores, and a job started before them stretches from about 4
    # seconds to about 13 while it competes with them. Extensions launch
    # browsers and package installs, which suffer most from that: the Chrome
    # launch check of the agent-browser extension takes under 2 seconds on
    # an idle runner and 7 to 10 beside the skill fetch. This step's
    # environment holds no credentials by design.
    - name: Start pack extensions
      shell: bash
      run: python3 "${GITHUB_ACTION_PATH}/install-packs.py" start

    - name: Ensure opencode directory exists
      shell: bash
      run: mkdir -p /home/runner/.local/share/opencode/project

    # Collects the download started by the prepare step. It sits right
    # before the report boot, which loads the plugin. A failed download
    # costs this run its live share and nothing else.
    - name: Stage OpenShare plugin (config + registration)
      shell: bash
      env:
        OPENSHARE_CONFIG: ${{ inputs.openshare-config-json }}
      run: |
        set -e
        if [ -z "$(printf '%s' "$OPENSHARE_CONFIG" | tr -d '[:space:]')" ]; then
          exit 0
        fi
        PLUGINS_DIR="$HOME/.mirrobot-plugins"
        BUNDLE="$PLUGINS_DIR/openshare.js"
        done_file="$RUNNER_TEMP/openshare-bundle.done"
        for _ in $(seq 1 450); do [ -f "$done_file" ] && break; sleep 0.2; done
        if [ ! -f "$done_file" ] || [ "$(cat "$done_file")" != "0" ]; then
          echo "::warning::OpenShare bundle fetch failed - live sharing disabled for this run."
          tail -n 5 "$RUNNER_TEMP/openshare-bundle.log" 2>/dev/null || true
          exit 0
        fi
        grep -q 'openshare' "$BUNDLE" || {
          echo "::warning::OpenShare bundle failed validation - live sharing disabled for this run."
          rm -f "$BUNDLE"; exit 0; }
        chmod 600 "$BUNDLE"
        echo "OpenShare bundle sha256: $(sha256sum "$BUNDLE" | cut -d' ' -f1)"

        # Adjacent config: the plugin reads it at load (env > adjacent
        # file > package root > walk-up > global home > defaults). Read
        # gating is assured by the plugin's init-ack alarm plus the
        # post-run step's gated:false warning - no env duplication.
        printf '%s' "$OPENSHARE_CONFIG" > "$PLUGINS_DIR/openshare.config.json"
        chmod 600 "$PLUGINS_DIR/openshare.config.json"

        # Register the plugin (idempotent append; the generated config is
        # file-local, the secret stays untouched).
        CFG="$HOME/.config/opencode/opencode.json"
        if [ -f "$CFG" ] && ! jq -e --arg p "$BUNDLE" '(.plugin // []) | index($p)' "$CFG" >/dev/null; then
          tmp=$(mktemp)
          jq --arg p "$BUNDLE" '.plugin = ((.plugin // []) + [$p])' "$CFG" > "$tmp" && mv "$tmp" "$CFG"
        fi
        echo "OpenShare staged: bundle + adjacent config + plugin registered."

    - name: Wait for pack extensions and report
      shell: bash
      run: python3 "${GITHUB_ACTION_PATH}/install-packs.py" wait

    # The wait step above is where a missing copy gets installed; keep the
    # copies only when there was none to restore.
    - name: Keep the plugin SDK for the next run
      if: steps.plugin_sdk.outputs.cache-hit != 'true' && steps.opencode_version.outputs.version != ''
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.config/opencode/node_modules
          ~/.config/opencode/package.json
          ~/.config/opencode/package-lock.json
          ~/.opencode/node_modules
          ~/.opencode/package.json
          ~/.opencode/package-lock.json
          ~/.cache/opencode/models.json
        key: ${{ steps.plugin_sdk.outputs.cache-primary-key }}
